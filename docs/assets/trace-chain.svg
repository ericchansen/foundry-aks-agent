<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" role="img" aria-labelledby="title description">
  <title id="title">One trace, native parent-child spans</title>
  <desc id="description">Three span nodes and two parent-child edges. POST /ask is the parent of invoke_agent boring-aks-agent, which is the parent of chat for the configured model deployment. All three carry the same gen_ai.agent.id; the request root also records demo.release_id. This diagram explains nesting, not measured duration.</desc>
  <defs>
    <marker id="parent-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 6 3-6 3" fill="none" stroke="#08756d" stroke-width="1.8"/></marker>
  </defs>
  <rect width="960" height="356" fill="#fff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="28" y="39" font-size="19" font-weight="600" fill="#08756d">Same trace_id. Same gen_ai.agent.id.</text>
    <g fill="none" stroke="#08756d" stroke-width="2">
      <path id="edge-request-agent" d="M56 130V177H115" marker-end="url(#parent-arrow)"/>
      <path id="edge-agent-model" d="M147 217V264H206" marker-end="url(#parent-arrow)"/>
    </g>
    <g id="node-request">
      <rect x="28" y="60" width="880" height="70" rx="8" fill="#eef3ff"/>
      <text x="51" y="103" font-size="22" font-weight="650" fill="#202a3b">POST /ask</text>
      <text x="885" y="103" text-anchor="end" font-size="18" fill="#204fce">Request root + demo.release_id</text>
    </g>
    <g id="node-agent">
      <rect x="115" y="147" width="793" height="70" rx="8" fill="#eaf6f3"/>
      <text x="138" y="190" font-size="22" font-weight="650" fill="#202a3b">invoke_agent boring-aks-agent</text>
      <text x="885" y="190" text-anchor="end" font-size="18" fill="#365d59">Native Pydantic span</text>
    </g>
    <g id="node-model">
      <rect x="206" y="234" width="702" height="70" rx="8" fill="#eaf6f3"/>
      <text x="229" y="277" font-size="22" font-weight="650" fill="#202a3b">chat &lt;model deployment&gt;</text>
      <text x="885" y="277" text-anchor="end" font-size="18" fill="#365d59">Native model span</text>
    </g>
    <text x="28" y="339" fill="#566377" font-size="16">Parent-child structure, not a duration chart. No duplicate agent span.</text>
  </g>
</svg>
